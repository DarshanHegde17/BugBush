<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BugBash Practice Coding - Practice algorithmic coding challenges, track learning streaks, and receive instant AI-powered complexity and quality insights.">
    <title>Practice Coding | BugBash Assessment Platform</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
    <link rel="shortcut icon" href="../assets/icons/favicon.ico">

    <!-- Early Theme Script -->
    <script src="../js/theme.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/user-dashboard.css?v=1.4">
    <link rel="stylesheet" href="../css/practice.css?v=1.4">
    <link rel="stylesheet" href="../css/responsive.css?v=1.4">
</head>
<body>

    <div class="dashboard-layout practice-container">
        
        <!-- ====================================================================
             1. Collapsible Sidebar Navigation
             ==================================================================== -->
        <aside class="sidebar" id="sidebar" aria-label="Main Application Sidebar">
            <!-- Sidebar Header & Brand Logo -->
            <div class="sidebar-header">
                <a href="../index.html" class="sidebar-brand" aria-label="BugBash Home">
                    <img src="../assets/images/bugbash-logo.png?v=1.1" alt="BugBash" class="sidebar-brand-img" height="36" width="75" style="height: 36px !important; max-height: 36px !important; width: auto !important; max-width: 130px !important; object-fit: contain !important; display: inline-block !important; vertical-align: middle !important;">
                    <span class="sidebar-brand-tag">AI</span>
                </a>
                <button type="button" class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle sidebar collapse" title="Toggle sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="sidebar-nav">
                <span class="nav-section-title">Workspace</span>
                
                <a class="nav-item" href="dashboard.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>

                <a class="nav-item" href="assessments.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        <path d="M9 14l2 2 4-4"></path>
                    </svg>
                    <span>My Assessments</span>
                </a>

                <a class="nav-item active" href="practice.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    <span>Practice Coding</span>
                </a>

                <a class="nav-item" href="dashboard.html#results">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>Results & Reports</span>
                </a>

                <span class="nav-section-title" style="margin-top: 10px;">Account</span>

                <a class="nav-item" href="profile.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>My Profile</span>
                </a>

                <a class="nav-item" href="settings.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>

            <!-- Sidebar Footer & Logout -->
            <div class="sidebar-footer">
                <button type="button" class="sidebar-logout-btn" id="sidebarLogoutBtn" title="Sign out of account">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <!-- ====================================================================
             2. Main Application Content Area
             ==================================================================== -->
        <div class="main-wrapper">
            
            <!-- Topbar Navigation -->
            <header class="topbar">
                <div class="topbar-left">
                    <div class="welcome-greeting">
                        Practice <span class="highlight">Coding Hub</span>
                    </div>
                </div>

                <div class="topbar-right">
                    <!-- Theme Toggle -->
                    <button type="button" class="topbar-btn theme-toggle" id="theme-toggle-btn" aria-label="Toggle theme" title="Toggle theme">
                        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="icon-moon" width="18" height="18" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>

                    <!-- User Profile Pill -->
                    <a href="profile.html" class="user-profile-pill">
                        <div class="user-avatar-small" id="topbarAvatar">CA</div>
                        <span class="user-name-text" id="topbarUserName">Candidate</span>
                    </a>
                </div>
            </header>

            <!-- Dashboard Content -->
            <main class="dashboard-content">
                
                <!-- 1. Practice Statistics Overview Grid (6 Cards) -->
                <section class="practice-stats-grid" aria-label="Practice Statistics">
                    <div class="practice-stat-card">
                        <div class="practice-stat-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                        </div>
                        <div class="practice-stat-info">
                            <span class="practice-stat-val" id="statSolvedCount">-</span>
                            <span class="practice-stat-label">Problems Solved</span>
                        </div>
                    </div>

                    <div class="practice-stat-card">
                        <div class="practice-stat-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 14 14"></polyline>
                            </svg>
                        </div>
                        <div class="practice-stat-info">
                            <span class="practice-stat-val" id="statAttemptedCount">-</span>
                            <span class="practice-stat-label">Attempted</span>
                        </div>
                    </div>

                    <div class="practice-stat-card">
                        <div class="practice-stat-icon easy">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="9 12 11 14 15 10"></polyline>
                            </svg>
                        </div>
                        <div class="practice-stat-info">
                            <span class="practice-stat-val" id="statEasySolved">-</span>
                            <span class="practice-stat-label">Easy Solved</span>
                        </div>
                    </div>

                    <div class="practice-stat-card">
                        <div class="practice-stat-icon medium">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        </div>
                        <div class="practice-stat-info">
                            <span class="practice-stat-val" id="statMediumSolved">-</span>
                            <span class="practice-stat-label">Medium Solved</span>
                        </div>
                    </div>

                    <div class="practice-stat-card">
                        <div class="practice-stat-icon hard">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                            </svg>
                        </div>
                        <div class="practice-stat-info">
                            <span class="practice-stat-val" id="statHardSolved">-</span>
                            <span class="practice-stat-label">Hard Solved</span>
                        </div>
                    </div>

                    <div class="practice-stat-card">
                        <div class="practice-stat-icon streak">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
                            </svg>
                        </div>
                        <div class="practice-stat-info">
                            <span class="practice-stat-val" id="statCurrentStreak">-</span>
                            <span class="practice-stat-label">Day Streak 🔥</span>
                        </div>
                    </div>
                </section>

                <!-- 2. Category & Language Quick Filter Chips -->
                <div class="category-chips-scroll" id="categoryChips">
                    <button type="button" class="category-chip active" data-category="all">All Topics</button>
                    <button type="button" class="category-chip" data-category="Python">Python</button>
                    <button type="button" class="category-chip" data-category="Java">Java</button>
                    <button type="button" class="category-chip" data-category="C">C</button>
                    <button type="button" class="category-chip" data-category="C++">C++</button>
                    <button type="button" class="category-chip" data-category="JavaScript">JavaScript</button>
                    <button type="button" class="category-chip" data-category="SQL">SQL</button>
                    <button type="button" class="category-chip" data-category="Data Structures">Data Structures</button>
                    <button type="button" class="category-chip" data-category="Algorithms">Algorithms</button>
                    <button type="button" class="category-chip" data-category="Problem Solving">Problem Solving</button>
                </div>

                <!-- 3. Working Filter and Search Controls Bar -->
                <div class="practice-filters-bar">
                    <div class="practice-search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="problemSearchInput" placeholder="Search problems by title, topic, or keyword..." aria-label="Search practice problems">
                    </div>

                    <div class="practice-dropdowns">
                        <!-- Difficulty Dropdown -->
                        <select id="difficultySelect" class="practice-select" aria-label="Filter by difficulty">
                            <option value="all">All Difficulties</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>

                        <!-- Language Dropdown -->
                        <select id="languageSelect" class="practice-select" aria-label="Filter by programming language">
                            <option value="all">All Languages</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                            <option value="C++">C++</option>
                            <option value="C">C</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="SQL">SQL</option>
                        </select>

                        <!-- Problem Status Dropdown -->
                        <select id="statusSelect" class="practice-select" aria-label="Filter by problem status">
                            <option value="all">All Statuses</option>
                            <option value="Not Started">Not Started</option>
                            <option value="Attempted">Attempted</option>
                            <option value="Solved">Solved</option>
                        </select>
                    </div>
                </div>

                <!-- 4. Recommended for You Section -->
                <section id="recommendationsSection" aria-label="Personalized Recommendations">
                    <div class="section-header-row">
                        <h2 class="section-header-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--primary-color);">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                            <span>Recommended for You</span>
                        </h2>
                    </div>
                    <div class="recommended-grid" id="recommendationsGrid">
                        <!-- Populated dynamically via practice.js -->
                    </div>
                </section>

                <!-- 5. Problems Listing Catalog -->
                <section aria-label="Problem Catalog">
                    <div class="section-header-row">
                        <h2 class="section-header-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--primary-color);">
                                <polyline points="16 18 22 12 16 6"></polyline>
                                <polyline points="8 6 2 12 8 18"></polyline>
                            </svg>
                            <span>All Practice Problems</span>
                            <span class="badge" id="problemCountBadge" style="margin-left: 6px; font-size: 12px;">14 Problems</span>
                        </h2>
                    </div>

                    <!-- Problems Grid -->
                    <div class="problems-catalog-grid" id="problemsCatalogGrid">
                        <!-- Populated dynamically via practice.js -->
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/practice.js"></script>
</body>
</html>
